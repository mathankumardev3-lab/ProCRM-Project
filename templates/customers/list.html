{% extends "base.html" %}{% block heading %}Customers{% endblock %}{% block content %}<div class="toolbar"><form><input name="q" value="{{ q }}" placeholder="Search customers..."><button class="btn secondary">Search</button></form><a class="btn" href="{% url 'customer_create' %}">+ Customer</a></div><section class="panel table-wrap"><table><tr><th>Name</th><th>Company</th><th>Email</th><th>Status</th><th>Actions</th></tr>{% for c in customers %}<tr><td><a href="{% url 'customer_detail' c.pk %}"><b>{{ c.name }}</b></a></td><td>{{ c.company }}</td><td>{{ c.email }}</td><td><span class="pill">{{ c.status }}</span></td><td><a href="{% url 'customer_edit' c.pk %}">Edit</a> · <a href="{{ c.whatsapp_link }}" target="_blank">WhatsApp</a></td></tr>{% empty %}<tr><td colspan="5">No customers found.</td></tr>{% endfor %}</table></section>{% endblock %}
